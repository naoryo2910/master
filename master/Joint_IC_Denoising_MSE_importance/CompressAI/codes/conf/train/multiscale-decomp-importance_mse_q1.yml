#### general settings

name: multiscale-decomp-importance_mse_q1
use_tb_logger: true
gpu_ids: [1]
# manual_seed: 1

#### datasets

datasets:
  train:
    root: /home/22x3047_sato/master/master/Joint_IC_Denoising_MSE_importance/data/flicker
    name: synthetic
    patch_size: 256
    batch_size: 4
    n_workers: 4
    use_shuffle: true
  val:
    root: /home/22x3047_sato/master/master/Joint_IC_Denoising_MSE_importance/data/flicker
    name: synthetic
    patch_size: 256
    batch_size: 1
    n_workers: 0
    use_shuffle: false
  
#### network

network:
  model: multiscale-decomp-importance
  quality: 1
  criterions:
    criterion_metric: mse
    criterion_fea: l1
  lambdas: 
    lambda_metric: 0.0018
    lambda_fea: 3.
  alphas:
    alpha_metric: 1.
    alpha_fea: 1.
  pretrained: false
  
#### training settings

train:
  mode: epoch
  epoch:
    value: 800
    lr: !!float 1e-4
    lr_aux: !!float 1e-3
    lr_scheme: LambdaLR
    warm_up_counts: 20
    milestones: [450, 550, 600, 650, 700] 
    gamma: 0.5
    val_freq: 1 # number of epochs to start a visualization
  clip_max_norm: 1.0
  loss_cap: 100

#### path
path:
  root: /home/22x3047_sato/master/master/Joint_IC_Denoising_MSE_importance
  # checkpoint: /path/to/checkpoint.pth.tar
  
#### logger

logger:
  print_freq: 100 # number of iterations to print a training progress
  save_checkpoint_freq: 10  # number of epochs to save a checkpoint
